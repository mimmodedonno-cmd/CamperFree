<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103f32">
<title>CamperFree 1.7.1</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#123f33;--bg:#eef3ee;--card:#fff;--muted:#68736d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172019}
body{display:flex;justify-content:center}
.app{width:100%;max-width:900px;min-height:100vh;padding:12px 12px 86px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.logo{font-size:24px;font-weight:900}.version{font-size:11px;color:var(--muted)}
.card{background:#fff;border-radius:18px;box-shadow:0 3px 18px #00000012;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inputWrap{position:relative;flex:1;min-width:220px}
input,button{font:inherit}
input{width:100%;border:1px solid #d7dfd9;border-radius:14px;padding:13px 14px;background:#fff}
button{border:0;border-radius:999px;padding:11px 14px;background:#fff;box-shadow:0 2px 8px #0001;cursor:pointer}
button.primary{background:var(--green);color:#fff;font-weight:800}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}
.chip.active{background:var(--green);color:#fff}
.suggestions{position:absolute;left:0;right:0;top:48px;background:#fff;border:1px solid #d7dfd9;border-radius:12px;z-index:3000;max-height:220px;overflow:auto;box-shadow:0 6px 20px #0002;display:none}
.suggestions div{padding:10px 12px;border-bottom:1px solid #eef2ee;cursor:pointer}
.suggestions div:last-child{border-bottom:0}
#map{height:58vh;min-height:430px;border-radius:18px;overflow:hidden;background:#dfe8e1}
.status{margin:8px 2px 0;font-weight:800;font-size:13px;color:#315440}
.routeTitle{font-weight:900;font-size:18px}
.muted{color:var(--muted);font-size:13px}
.waypoint{display:flex;gap:6px;margin-top:8px}
.waypoint input{flex:1}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e9e5;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:2500}
.bottom span{font-size:11px;text-align:center}
.legend{position:absolute;left:18px;bottom:18px;z-index:1000;background:#123f33;color:#fff;border-radius:14px;padding:9px 11px;font-size:12px}
@media(max-width:600px){.app{padding:10px 10px 82px}#map{height:56vh;min-height:390px}.logo{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">🚐 CamperFree</div><div class="version">v1.7.1</div></div>

  <div class="card">
    <div class="row">
      <div class="inputWrap">
        <input id="from" autocomplete="off" placeholder="Partenza">
        <div id="fromSug" class="suggestions"></div>
      </div>
      <div class="inputWrap">
        <input id="to" autocomplete="off" placeholder="Destinazione">
        <div id="toSug" class="suggestions"></div>
      </div>
      <button id="planBtn" class="primary">Pianifica</button>
    </div>
    <div id="waypoints"></div>
    <div style="margin-top:8px"><button id="addWp">＋ Aggiungi tappa</button></div>
  </div>

  <div class="chips">
    <button class="chip active" data-kind="all">🌐 Tutti</button>
    <button class="chip" data-kind="free">🚐 Soste</button>
    <button class="chip" data-kind="camp">⛺ Campeggi</button>
    <button class="chip" data-kind="fuel">⛽ Carburante</button>
    <button class="chip" data-kind="service">💧 Servizi</button>
    <button class="chip" data-kind="charge">⚡ Ricarica</button>
  </div>

  <div style="position:relative">
    <div id="map"></div>
    <div class="legend">🚐 soste · ⛺ campeggi · ⛽ carburante · 💧 servizi · ⚡ ricarica</div>
  </div>

  <div class="card">
    <div id="routeTitle" class="routeTitle">Nessun percorso selezionato</div>
    <div id="routeMeta" style="margin-top:4px;font-weight:800;font-size:15px;color:#315440">Inserisci partenza e destinazione</div>
    <div id="poiStatus" class="status">POI: in attesa del percorso</div>
  </div>
</div>

<div class="bottom">
  <span>🗺️<br><b>Mappa</b></span>
  <span>🚐<br>Viaggio</span>
  <span>❤️<br>Preferiti</span>
  <span>🚐<br>Veicolo</span>
  <span>👤<br>Profilo</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([42.5,12.5],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(map);
setTimeout(()=>map.invalidateSize(),200);

let routeLayer=null;
let poiLayer=L.layerGroup().addTo(map);
let poiData=[];
let wpCount=0;
const colors={free:'#174f3f',camp:'#3b7d2a',fuel:'#9d2f2f',service:'#2a72a8',charge:'#a87500'};

function setPoiStatus(t){document.getElementById('poiStatus').textContent='POI: '+t}
function normalizeName(s){return s.trim().replace(/\s+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}

function liveCapitalizeInput(el){
  el.addEventListener('input',()=>{
    const pos=el.selectionStart;
    const v=el.value;
    if(!v)return;
    const next=v.replace(/(^|[\s'-])([a-zà-öø-ÿ])/g,(m,a,b)=>a+b.toUpperCase());
    if(next!==v){
      el.value=next;
      try{el.setSelectionRange(pos,pos)}catch(e){}
    }
  });
}

async function searchCity(q){
  if(!q || q.trim().length<2) return [];
  const u='https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=it,fr,ch,at,si,de,es,pt,hr&addressdetails=1&q='+encodeURIComponent(q);
  const r=await fetch(u,{headers:{'Accept':'application/json'}});
  if(!r.ok) return [];
  return await r.json();
}
function bindAutocomplete(inputId,sugId,onSelect){
  const input=document.getElementById(inputId), box=document.getElementById(sugId);
  let timer;
  input.addEventListener('input',()=>{
    clearTimeout(timer);
    timer=setTimeout(async()=>{
      const res=await searchCity(input.value);
      box.innerHTML='';
      if(!res.length){box.style.display='none';return}
      res.forEach(x=>{
        const d=document.createElement('div');
        const label=x.display_name.split(',').slice(0,3).join(',');
        d.textContent=label;
        d.onclick=()=>{input.value=normalizeName(label.split(',')[0]);input.dataset.lat=x.lat;input.dataset.lon=x.lon;box.style.display='none';onSelect&&onSelect()}
        box.appendChild(d);
      });
      box.style.display='block';
    },250);
  });
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){box.style.display='none';input.value=normalizeName(input.value);onSelect&&onSelect()}
  });
}
liveCapitalizeInput(document.getElementById('from'));
liveCapitalizeInput(document.getElementById('to'));
bindAutocomplete('from','fromSug',()=>document.getElementById('to').focus());
bindAutocomplete('to','toSug');

document.getElementById('addWp').onclick=()=>{
  if(wpCount>=6)return;
  wpCount++;
  const wrap=document.createElement('div');
  wrap.className='waypoint';
  wrap.innerHTML=`<input placeholder="Tappa ${wpCount}" class="wp"><button type="button">✕</button>`;
  const wpin=wrap.querySelector('input');
  liveCapitalizeInput(wpin);
  wrap.querySelector('button').onclick=()=>wrap.remove();
  document.getElementById('waypoints').appendChild(wrap);
}

async function geocode(v){
  const res=await searchCity(v);
  if(!res.length) throw new Error('Località non trovata: '+v);
  return [Number(res[0].lon),Number(res[0].lat)];
}

function sampleRoute(latlngs,n=16){
  if(latlngs.length<=n)return latlngs;
  const out=[];
  for(let i=0;i<n;i++) out.push(latlngs[Math.round(i*(latlngs.length-1)/(n-1))]);
  return out;
}
function iconFor(p){
  const emoji={free:'🚐',camp:'⛺',fuel:'⛽',service:'💧',charge:'⚡'}[p.kind]||'📍';
  return L.divIcon({className:'',html:`<div style="font-size:24px;filter:drop-shadow(0 1px 2px #fff)">${emoji}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
}
function renderPois(kind='all'){
  poiLayer.clearLayers();
  poiData.filter(p=>kind==='all'||p.kind===kind).forEach(p=>{
    L.marker([p.lat,p.lng],{icon:iconFor(p)}).bindPopup(`<b>${p.name||'Punto utile'}</b><br>${p.meta||''}`).addTo(poiLayer)
  });
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPois(b.dataset.kind)
});

async function loadPois(latlngs){
  setPoiStatus('ricerca in corso…');
  const samples=sampleRoute(latlngs,10).map(p=>({lat:p[0],lng:p[1]}));
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),45000);
    let r;
    try{
      r=await fetch('/api/pois',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({samples,corridorKm:12}),
        cache:'no-store',
        signal:controller.signal
      });
    } finally {
      clearTimeout(timer);
    }
    const data=await r.json();
    if(!r.ok||!data.ok) throw new Error(data.detail||data.error||('HTTP '+r.status));
    poiData=Array.isArray(data.pois)?data.pois:[];
    renderPois('all');
    setPoiStatus(poiData.length+' punti trovati');
  }catch(e){
    console.error(e); poiData=[]; renderPois('all'); setPoiStatus(e.name==='AbortError' ? 'tempo scaduto, riprova' : 'errore: '+e.message);
  }
}

document.getElementById('planBtn').onclick=async()=>{
  const from=document.getElementById('from').value.trim(), to=document.getElementById('to').value.trim();
  if(!from||!to){alert('Inserisci partenza e destinazione');return}
  document.getElementById('routeTitle').textContent=normalizeName(from)+' → '+normalizeName(to);
  document.getElementById('routeMeta').textContent='Calcolo percorso…';
  setPoiStatus('in attesa del percorso');
  try{
    const coords=[];
    coords.push(await geocode(from));
    for(const wp of [...document.querySelectorAll('.wp')]){
      if(wp.value.trim()) coords.push(await geocode(wp.value.trim()));
    }
    coords.push(await geocode(to));
    const routeUrl='https://router.project-osrm.org/route/v1/driving/'+coords.map(c=>c.join(',')).join(';')+'?overview=full&geometries=geojson&steps=false';
    const rr=await fetch(routeUrl);
    const rd=await rr.json();
    if(!rd.routes?.length) throw new Error('Percorso non disponibile');
    const route=rd.routes[0];
    const latlngs=route.geometry.coordinates.map(c=>[c[1],c[0]]);
    if(routeLayer)map.removeLayer(routeLayer);
    routeLayer=L.polyline(latlngs,{weight:5,opacity:.85,color:'#365d55'}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
    setTimeout(()=>map.invalidateSize(),150);
    const kmTot=Math.round(route.distance/1000);
    const totalMin=Math.round(route.duration/60);
    const hh=Math.floor(totalMin/60), mm=totalMin%60;
    document.getElementById('routeMeta').textContent='📏 '+kmTot+' km · ⏱️ '+hh+' h '+mm+' min';
    await loadPois(latlngs);
  }catch(e){
    console.error(e);
    document.getElementById('routeMeta').textContent=e.message;
    setPoiStatus('percorso non calcolato');
  }
};

window.addEventListener('resize',()=>map.invalidateSize());
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
